    <header class="page-header">
      <div class="container">
        <p class="eyebrow">
          Event highlights
        </p>
        <h1>
          The moments
          <br>
          <span class="gradient-text">
            between matches.
          </span>
        </h1>
      </div>
    </header>
    <main class="section">
      <!-- Responsive photo gallery and event-video section. -->
      <div class="container">
        <div class="row g-4">
          <div class="col-md-6 col-lg-4">
            <div class="gallery-item">
              <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=900&q=80" alt="Gaming event">
            </div>
          </div>
          <div class="col-md-6 col-lg-4">
            <div class="gallery-item">
              <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=900&q=80" alt="Gaming setup">
            </div>
          </div>
          <div class="col-md-6 col-lg-4">
            <div class="gallery-item">
              <img src="https://images.unsplash.com/photo-1547394765-185e1e68f34e?auto=format&fit=crop&w=900&q=80" alt="Game controller">
            </div>
          </div>
          <div class="col-md-6 col-lg-6">
            <div class="gallery-item">
              <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1000&q=80" alt="Retro arcade">

          </div>

            <div class="gallery-item">

            Last LAN night.
          </h2>
          <iframe src="https://www.youtube-nocookie.com/embed/5qap5aO4i9A" title="Event highlight video" allowfullscreen>
          </iframe>
        </div>
      </div>
    </main>
    <div class="lightbox">
      <img src="" alt="Gallery full size">
    </div>
    <footer class="footer py-4">

    <!-- jQuery lightbox enlarges an image and closes when the overlay is clicked. -->
